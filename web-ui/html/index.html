<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis Model</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h2 class="text-center">Sentiment Analysis</h2>
                    </div>
                    <div class="card-body">
                        <form id="sentiment-form">
                            <div class="mb-3">
                                <label for="text-input" class="form-label">Enter text for sentiment analysis:</label>
                                <textarea class="form-control" id="text-input" rows="4" placeholder="Type your text here..."></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Analyze Sentiment</button>
                            </div>
                        </form>
                        
                        <div id="result-container" class="mt-4 d-none">
                            <h4>Analysis Result:</h4>
                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <h5>Sentiment: <span id="sentiment-result" class="fw-bold"></span></h5>
                                            <h5>Confidence: <span id="confidence-result" class="fw-bold"></span></h5>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="progress mb-2">
                                                <div id="positive-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                                            </div>
                                            <p>Positive: <span id="positive-score">0%</span></p>
                                            
                                            <div class="progress">
                                                <div id="negative-bar" class="progress-bar bg-danger" role="progressbar" style="width: 0%"></div>
                                            </div>
                                            <p>Negative: <span id="negative-score">0%</span></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div id="error-container" class="mt-4 d-none">
                            <div class="alert alert-danger" role="alert">
                                <h5>Error:</h5>
                                <p id="error-message"></p>
                            </div>
                        </div>
                        
                        <div id="loading-container" class="mt-4 d-none text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Analyzing text...</p>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-4">
                    <div class="card-header bg-info text-white">
                        <h4>Sample Texts</h4>
                    </div>
                    <div class="card-body">
                        <div class="list-group">
                            <button class="list-group-item list-group-item-action sample-text">I love this product, it's amazing!</button>
                            <button class="list-group-item list-group-item-action sample-text">This is terrible, worst purchase ever</button>
                            <button class="list-group-item list-group-item-action sample-text">Great quality, would recommend to everyone</button>
                            <button class="list-group-item list-group-item-action sample-text">Poor customer service, very disappointed</button>
                            <button class="list-group-item list-group-item-action sample-text">Excellent value for money, exceeded expectations</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center text-muted py-3 mt-5">
        <div class="container">
            <p>Powered by KitOps + Jozu Hub</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
